# SOLUTION-FILE lab-04
# ML assets as code (lab 04). Deployed with the rest of the bundle.
resources:
  experiments:
    churn_experiment:
      name: /Workspace/Users/${workspace.current_user.userName}/bootcamp-churn-${bundle.target}

  jobs:
    train_churn_model:
      name: train_churn_model
      description: Recompute customer features, retrain and register the churn models
      tasks:
        - task_key: train
          notebook_task:
            notebook_path: ../src/notebooks/04_ml_training.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.sales.name}
              experiment_path: ${resources.experiments.churn_experiment.name}

